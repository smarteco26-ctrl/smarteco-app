  <header class="fixed top-0 w-full z-50 pt-safe bg-surface/80 backdrop-blur-xl shadow-[0_1px_8px_rgba(0,0,0,0.04)]"><div class="h-14 px-margin flex items-center justify-between"><button aria-label="Retour" class="w-11 h-11 -ml-space-xs rounded-full flex items-center justify-center text-primary active:scale-95 active:bg-surface-container transition-all" onclick="history.back()" type="button"><span class="material-symbols-outlined text-[24px]">arrow_back_ios_new</span></button><div class="flex items-center gap-space-xs"><span class="font-label-md text-label-md text-on-surface tracking-tight font-semibold">Notifications</span></div><div class="flex items-center justify-end w-11 h-11"><img alt="Profile" class="w-8 h-8 rounded-full object-cover" src="https://lh3.googleusercontent.com/aida/AEtjO1VflyX0hjrP5abvjnGunV6O9BveTVROzJNY4nhH1E-zcGtzZfbfkhyQIusDIDs5cObwTlpaBBaBmA7sDxCQ-o7cW9yCk5VNGbamkwIj3SHPBguXuG57ymXrc6BtFnKmH9qFJULXu2MhSbXp0Inw4ikKkYoG8dnnTV9a6rtU2aqWX5RGhiERrftaO8IqBEj0d1UtdXni9I3FSNQQ-ODHrTqsIyUvhtxJGl8HTQqN9CF_adI_z-jwOW6nw4tfZjy-ZB6koQujmFSAcw"></div></div></header><main class="flex-1 flex flex-col relative w-full pt-14 pb-safe bg-surface"><div class="flex flex-col w-full px-margin pb-space-xl">
<!-- Status & Quick Action Utility Header -->
<div class="flex items-center justify-between py-space-sm">
<div class="flex items-center gap-space-xs">
<span class="inline-flex w-2.5 h-2.5 rounded-full bg-secondary animate-pulse"></span>
<span class="font-label-sm text-label-sm text-on-surface-variant font-medium">Flux en direct • PWA Sync</span>
</div>
<button class="font-label-sm text-label-sm text-primary hover:text-tertiary font-semibold active:opacity-60 transition-opacity" id="markAllReadBtn" type="button">
      Tout marquer comme lu
    </button>
</div>
<!-- Segmented Filter Pills (iOS 17 Vibrancy Scrollable Control) -->
<div class="flex items-center gap-space-xs overflow-x-auto py-space-xs no-scrollbar">
<button class="filter-pill flex-shrink-0 px-space-md py-1.5 rounded-full font-label-sm text-label-sm font-semibold transition-all bg-primary text-on-primary shadow-sm" data-filter="all" type="button">
      Toutes
    </button>
<button class="filter-pill flex-shrink-0 px-space-md py-1.5 rounded-full font-label-sm text-label-sm font-semibold transition-all bg-surface-container text-on-surface-variant hover:bg-surface-container-high" data-filter="alert" type="button">
      Alertes
    </button>
<button class="filter-pill flex-shrink-0 px-space-md py-1.5 rounded-full font-label-sm text-label-sm font-semibold transition-all bg-surface-container text-on-surface-variant hover:bg-surface-container-high" data-filter="smartia" type="button">
      SmartIA
    </button>
<button class="filter-pill flex-shrink-0 px-space-md py-1.5 rounded-full font-label-sm text-label-sm font-semibold transition-all bg-surface-container text-on-surface-variant hover:bg-surface-container-high" data-filter="promo" type="button">
      Offres
    </button>
</div>
<!-- Notifications Feed -->
<div class="flex flex-col gap-space-md mt-space-md" id="notificationsList"></div>
<!-- Bottom PWA iOS Notification Status Pill & Settings Hint -->
<div class="mt-space-lg mb-space-sm flex flex-col items-center text-center p-space-md rounded-DEFAULT bg-surface-container-low">
<div class="flex items-center gap-1.5 text-secondary mb-1">
<span class="material-symbols-outlined text-[18px]">notifications_active</span>
<span class="font-label-sm text-label-sm font-semibold">Notifications actives</span>
</div>
<p class="font-body-sm text-body-sm text-on-surface-variant max-w-[280px]">
      Les notifications push sont activées pour ce terminal. Vous recevrez les alertes de coupure réseau et vos reçus par SMS.
    </p>
<button class="mt-space-xs font-label-sm text-label-sm text-primary font-semibold hover:underline active:opacity-60" type="button">
      Gérer les préférences de réception
    </button>
</div>
</div>
<script>
  (function() {
    const SUPABASE_URL = "https://qdrarbfnbzirdevclgeg.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_M5gGWJgRMO-lTfm6bam28Q_UK55h4qo";
    const commande = JSON.parse(localStorage.getItem('smarteco_commande') || '{}');
    const markAllReadBtn = document.getElementById('markAllReadBtn');
    const filterPills = document.querySelectorAll('.filter-pill');
    const listEl = document.getElementById('notificationsList');
    let notifs = [];

    const ICONES = { alert: 'timer_off', smartia: 'smart_toy', promo: 'wifi_add', info: 'verified' };

    function tempsEcoule(dateStr) {
      const diffMin = Math.round((Date.now() - new Date(dateStr).getTime()) / 60000);
      if (diffMin < 1) return "à l'instant";
      if (diffMin < 60) return `${diffMin} min`;
      const diffH = Math.round(diffMin / 60);
      if (diffH < 24) return `${diffH} h`;
      return `${Math.round(diffH / 24)} j`;
    }

    function rendre() {
      if (notifs.length === 0) {
        listEl.innerHTML = `<p class="font-body-sm text-body-sm text-on-surface-variant text-center py-8">Aucune notification pour l'instant.</p>`;
        return;
      }
      listEl.innerHTML = notifs.map(n => `
        <article class="notification-card relative flex flex-col p-space-md rounded-DEFAULT bg-surface-container-lowest shadow-sm" data-category="${n.categorie}">
          <div class="flex items-start justify-between gap-space-sm mb-space-xs">
            <div class="flex items-center gap-space-xs min-w-0">
              <div class="w-8 h-8 rounded-full bg-surface-container-high text-primary flex items-center justify-center flex-shrink-0">
                <span class="material-symbols-outlined text-[18px]">${ICONES[n.categorie] || 'notifications'}</span>
              </div>
              <div class="flex flex-col min-w-0">
                <div class="flex items-center gap-space-xs">
                  <span class="font-label-md text-label-md text-on-surface font-semibold truncate">${n.titre}</span>
                  ${!n.lue ? '<span class="unread-dot w-2 h-2 rounded-full bg-error flex-shrink-0"></span>' : ''}
                </div>
              </div>
            </div>
            <span class="font-label-sm text-label-sm text-on-surface-variant flex-shrink-0">${tempsEcoule(n.created_at)}</span>
          </div>
          <p class="font-body-sm text-body-sm text-on-surface-variant mt-1 leading-relaxed">${n.corps}</p>
        </article>
      `).join('');
    }

    async function charger() {
      if (!commande.telephone) {
        listEl.innerHTML = `<p class="font-body-sm text-body-sm text-on-surface-variant text-center py-8">Connectez-vous pour voir vos notifications.</p>`;
        return;
      }
      try {
        const res = await fetch(
          `${SUPABASE_URL}/rest/v1/notifications?telephone=eq.${encodeURIComponent(commande.telephone)}&select=*&order=created_at.desc`,
          { headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` } }
        );
        notifs = await res.json();
        if (!Array.isArray(notifs)) notifs = [];
      } catch (e) {
        console.error(e);
        notifs = [];
      }
      rendre();
    }

    if (markAllReadBtn) {
      markAllReadBtn.addEventListener('click', async () => {
        markAllReadBtn.textContent = 'Tout est lu';
        markAllReadBtn.classList.remove('text-primary');
        markAllReadBtn.classList.add('text-on-surface-variant');
        notifs.forEach(n => n.lue = true);
        rendre();
        if (commande.telephone) {
          fetch(
            `${SUPABASE_URL}/rest/v1/notifications?telephone=eq.${encodeURIComponent(commande.telephone)}&lue=eq.false`,
            {
              method: 'PATCH',
              headers: {
                'apikey': SUPABASE_ANON_KEY,
                'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                'Content-Type': 'application/json',
                'Prefer': 'return=minimal',
              },
              body: JSON.stringify({ lue: true }),
            }
          ).catch(console.error);
        }
      });
    }

    filterPills.forEach(pill => {
      pill.addEventListener('click', () => {
        const filter = pill.getAttribute('data-filter');
        filterPills.forEach(p => {
          p.classList.remove('bg-primary', 'text-on-primary', 'shadow-sm');
          p.classList.add('bg-surface-container', 'text-on-surface-variant');
        });
        pill.classList.remove('bg-surface-container', 'text-on-surface-variant');
        pill.classList.add('bg-primary', 'text-on-primary', 'shadow-sm');
        document.querySelectorAll('.notification-card').forEach(card => {
          const category = card.getAttribute('data-category');
          card.style.display = (filter === 'all' || category === filter) ? 'flex' : 'none';
        });
      });
    });

    charger();
  })();
</script></main>
</body></html>
