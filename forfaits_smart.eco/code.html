50 pt-safe bg-surface/80 backdrop-blur-xl shadow-[0_1px_8px_rgba(0,0,0,0.04)]"><div class="h-16 max-w-[430px] mx-auto px-margin flex items-center justify-between"><h1 class="font-headline-sm text-headline-sm text-on-surface font-bold tracking-tight truncate">Forfaits</h1><div class="flex items-center gap-space-xs flex-shrink-0"><button aria-label="Notifications" class="relative w-11 h-11 flex items-center justify-center rounded-full text-on-surface-variant hover:text-on-surface transition-colors" onclick="window.location.href='../notifications_smart.eco/code.html'" type="button"><span class="material-symbols-outlined text-[24px]">notifications</span></button><button aria-label="Profil utilisateur" class="w-11 h-11 flex items-center justify-center rounded-full transition-transform active:scale-95" onclick="window.location.href='../profil_param_tres_smart.eco/code.html'" type="button"><span class="material-symbols-outlined text-[24px] text-on-surface-variant">account_circle</span></button></div></div></header>

<main class="flex-1 flex flex-col relative w-full max-w-[430px] mx-auto px-margin pt-20 pb-28 bg-surface">

<div class="flex items-center gap-3">
<button aria-label="Moins" class="qte-moins w-8 h-8 rounded-full bg-surface-container text-primary text-lg leading-none flex items-center justify-center" type="button">−</button>
<span class="qte-val font-label-md text-label-md text-on-surface w-4 text-center">1</span>

<div class="flex items-center gap-3">

<section class="fixed bottom-16 left-0 right-0 z-40 bg-surface/90 backdrop-blur-xl px-margin pt-space-sm pb-3 shadow-[0_-2px_12px_rgba(0,0,0,0.04)]">
<div class="max-w-[430px] mx-auto flex items-center justify-between gap-3">
<div class="flex flex-col">
<span class="font-body-sm text-body-sm text-on-surface-variant" id="recap-label">Heures</span>
<span class="font-headline-sm text-headline-sm text-on-surface font-bold" id="recap-prix">15 HTG</span>
</div>
<button class="h-12 px-6 rounded-full bg-primary text-on-primary font-label-lg text-label-lg font-semibold" id="continuer-btn" type="button">Continuer</button>
</div>
</section>

<script>
  const PRIX = { heure: 15, jour: 75, semaine: 350, mois: 1100 };
  const LABELS = { heure: 'Heures', jour: 'Jours', semaine: 'Semaines', mois: 'Mois' };
  const quantites = { heure: 1, jour: 1, semaine: 1 };
  let planActif = 'heure';

  const recapLabel = document.getElementById('recap-label');
  const recapPrix = document.getElementById('recap-prix');

  function majRecap() {
    const q = planActif === 'mois' ? 1 : quantites[planActif];
    const total = planActif === 'mois' ? PRIX.mois : PRIX[planActif] * q;
    recapLabel.textContent = planActif === 'mois' ? 'Mois' : `${q} ${LABELS[planActif].toLowerCase()}`;
    recapPrix.textContent = total + ' HTG';
  }

  document.querySelectorAll('[data-unite]').forEach(row => {
    const unite = row.dataset.unite;
    const valEl = row.querySelector('.qte-val');

    row.addEventListener('click', (e) => {
      if (e.target.closest('.qte-moins') || e.target.closest('.qte-plus')) return;
      planActif = unite;
      majRecap();
    });

    row.querySelector('.qte-moins').addEventListener('click', () => {
      quantites[unite] = Math.max(1, quantites[unite] - 1);
      valEl.textContent = quantites[unite];
      planActif = unite;
      majRecap();
    });
    row.querySelector('.qte-plus').addEventListener('click', () => {
      const max = unite === 'heure' ? 24 : unite === 'jour' ? 30 : 8;
      quantites[unite] = Math.min(max, quantites[unite] + 1);
      valEl.textContent = quantites[unite];
      planActif = unite;
      majRecap();
    });
  });

  document.querySelector('[data-plan="mois"]').addEventListener('click', () => {
    planActif = 'mois';
    majRecap();
  });

  document.getElementById('continuer-btn').addEventListener('click', () => {
    const quantite = planActif === 'mois' ? 1 : quantites[planActif];
    const commande = JSON.parse(localStorage.getItem('smarteco_commande') || '{}');
    localStorage.setItem('smarteco_commande', JSON.stringify({ ...commande, planId: planActif, quantite }));
    window.location.href = '../d_tail_du_forfait_smart.eco/code.html';
  });

  majRecap();
</script>
