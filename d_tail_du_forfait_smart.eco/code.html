<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"><style>@layer base{html,body{width:100vw;min-height:100%;margin:0;padding:0;}body{overscroll-behavior-y:none;-webkit-tap-highlight-color:transparent;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { colors: { "surface-container-lowest": "#ffffff", "surface-bright": "#faf8ff", "on-primary-fixed": "#001d33", "tertiary-container": "#3975c2", "on-surface": "#131b2e", "on-surface-variant": "#3f4851", "surface-dim": "#d2d9f4", "surface-variant": "#dae2fd", "secondary": "#006d3c", "primary": "#006098", "tertiary-fixed": "#d5e3ff", "on-secondary-fixed": "#00210e", "error-container": "#ffdad6", "on-primary-fixed-variant": "#004a77", "inverse-surface": "#283044", "on-tertiary-container": "#fefcff", "tertiary-fixed-dim": "#a6c8ff", "surface-container-high": "#e2e7ff", "error": "#ba1a1a", "on-error-container": "#93000a", "surface-tint": "#00639c", "on-secondary": "#ffffff", "on-secondary-container": "#007440", "on-primary-container": "#fdfcff", "on-tertiary": "#ffffff", "inverse-primary": "#98cbff", "background": "#faf8ff", "outline-variant": "#bfc7d3", "surface-container-low": "#f2f3ff", "on-primary": "#ffffff", "on-tertiary-fixed-variant": "#004787", "on-tertiary-fixed": "#001c3b", "primary-fixed": "#cfe5ff", "on-secondary-fixed-variant": "#00522c", "inverse-on-surface": "#eef0ff", "surface-container-highest": "#dae2fd", "tertiary": "#145ca7", "outline": "#707882", "surface": "#faf8ff", "primary-fixed-dim": "#98cbff", "on-error": "#ffffff", "primary-container": "#007abf", "surface-container": "#eaedff", "secondary-fixed": "#72fda8", "secondary-fixed-dim": "#52df8e", "on-background": "#131b2e", "secondary-container": "#72fda8" }, borderRadius: { DEFAULT: "1rem", lg: "2rem", xl: "3rem", full: "9999px" }, spacing: { "margin-desktop": "2rem", "space-md": "1rem", "gutter": "1rem", "space-sm": "0.5rem", "margin": "1rem", "space-xs": "0.25rem", "space-lg": "1.5rem", "space-xl": "2rem", "gutter-sm": "0.75rem" }, fontFamily: { "headline-md": ["Inter"], "label-lg": ["Inter"], "headline-sm": ["Inter"], "label-md": ["Inter"], "headline-lg": ["Inter"], "body-sm": ["Inter"], "body-lg": ["Inter"], "headline-xl": ["Inter"], "body-md": ["Inter"], "headline-xl-mobile": ["Inter"], "numeric-stat": ["Inter"], "label-sm": ["Inter"] }, fontSize: { "headline-md": ["22px", { lineHeight: "28px", letterSpacing: "-0.015em", fontWeight: "600" }], "label-lg": ["17px", { lineHeight: "22px", letterSpacing: "-0.01em", fontWeight: "600" }], "headline-sm": ["20px", { lineHeight: "25px", letterSpacing: "-0.012em", fontWeight: "600" }], "label-md": ["15px", { lineHeight: "20px", letterSpacing: "-0.005em", fontWeight: "600" }], "headline-lg": ["28px", { lineHeight: "34px", letterSpacing: "-0.018em", fontWeight: "700" }], "body-sm": ["13px", { lineHeight: "18px", letterSpacing: "0em", fontWeight: "400" }], "body-lg": ["17px", { lineHeight: "22px", letterSpacing: "-0.01em", fontWeight: "400" }], "headline-xl": ["34px", { lineHeight: "41px", letterSpacing: "-0.022em", fontWeight: "700" }], "body-md": ["15px", { lineHeight: "20px", letterSpacing: "-0.005em", fontWeight: "400" }], "headline-xl-mobile": ["30px", { lineHeight: "36px", letterSpacing: "-0.02em", fontWeight: "700" }], "numeric-stat": ["24px", { lineHeight: "28px", letterSpacing: "-0.02em", fontWeight: "700" }], "label-sm": ["12px", { lineHeight: "16px", letterSpacing: "0.01em", fontWeight: "500" }] } } } };</script><style>body{min-height:max(884px,100dvh);}</style></head><body class="bg-surface text-on-surface antialiased flex flex-col min-h-screen">

<header class="fixed top-0 w-full z-50 pt-safe bg-surface/80 backdrop-blur-xl shadow-[0_1px_8px_rgba(0,0,0,0.04)]"><div class="h-14 px-margin flex items-center justify-between"><button aria-label="Retour" class="w-11 h-11 -ml-space-xs rounded-full flex items-center justify-center text-primary active:scale-95 active:bg-surface-container transition-all" onclick="history.back()" type="button"><span class="material-symbols-outlined text-[24px]">arrow_back_ios_new</span></button><span class="font-label-md text-label-md text-on-surface tracking-tight font-semibold">Récapitulatif</span><div class="w-11 h-11"></div></div></header>

<main class="flex-1 flex flex-col relative w-full pt-14 pb-32 bg-surface">
<div class="flex flex-col w-full max-w-[430px] mx-auto px-margin">

<section class="mt-space-md mb-space-lg p-space-lg rounded-lg bg-surface-container-lowest shadow-sm">
<h1 class="font-headline-md text-headline-md text-on-surface tracking-tight" id="plan-title">Forfait</h1>
<p class="mt-1 font-body-md text-body-md text-on-surface-variant" id="plan-subtitle"></p>
<div class="mt-space-md pt-space-md border-t border-surface-container flex items-baseline justify-between">
<span class="font-label-md text-label-md text-on-surface-variant">Total à payer</span>
<span class="font-headline-lg text-headline-lg text-primary font-bold" id="plan-price">— HTG</span>
</div>
</section>

</div>
</main>

<aside class="fixed bottom-0 left-0 right-0 z-40 bg-surface/90 backdrop-blur-xl px-margin pt-space-sm pb-safe shadow-[0_-2px_12px_rgba(0,0,0,0.04)]">
<div class="max-w-[430px] mx-auto pb-3">
<button class="w-full h-[52px] rounded-full bg-primary text-on-primary font-label-lg text-label-lg font-semibold flex items-center justify-center gap-2" id="submit-order-btn" type="button">
<span>Continuer</span>
<span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</div>
</aside>

<script>
    const NOMS = { heure: 'Forfait Heures', jour: 'Forfait Jour', semaine: 'Forfait Semaine', mois: 'Forfait Mois' };
    const PRIX = { heure: 15, jour: 75, semaine: 350, mois: 1100 };
    const SOUS_TITRES = {
      heure: 'Accès WiFi à l\'heure, selon votre besoin.',
      jour: 'Accès WiFi illimité pendant 24 heures.',
      semaine: 'Accès WiFi illimité pendant 7 jours.',
      mois: 'Accès WiFi illimité pendant 30 jours.',
    };

    const commande = JSON.parse(localStorage.getItem('smarteco_commande') || '{}');
    const planId = commande.planId || 'jour';
    const quantite = commande.quantite || 1;
    const montant = planId === 'mois' ? PRIX.mois : PRIX[planId] * quantite;
    const titre = planId === 'heure' ? `${NOMS.heure} (${quantite}h)` : NOMS[planId];

    document.getElementById('plan-title').textContent = titre;
    document.getElementById('plan-subtitle').textContent = SOUS_TITRES[planId];
    document.getElementById('plan-price').textContent = montant + ' HTG';

    document.getElementById('submit-order-btn').addEventListener('click', () => {
      window.location.href = '../paiement_smart.eco/code.html';
    });
  </script>

</body></html>
