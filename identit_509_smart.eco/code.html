: "#72fda8", "secondary-fixed-dim": "#52df8e", "on-background": "#131b2e", "secondary-container": "#72fda8" }, borderRadius: { DEFAULT: "1rem", lg: "2rem", xl: "3rem", full: "9999px" }, spacing: { "margin-desktop": "2rem", "space-md": "1rem", "gutter": "1rem", "space-sm": "0.5rem", "margin": "1rem", "space-xs": "0.25rem", "space-lg": "1.5rem", "space-xl": "2rem", "gutter-sm": "0.75rem" }, fontFamily: { "headline-md": ["Inter"], "label-lg": ["Inter"], "headline-sm": ["Inter"], "label-md": ["Inter"], "headline-lg": ["Inter"], "body-sm": ["Inter"], "body-lg": ["Inter"], "headline-xl": ["Inter"], "body-md": ["Inter"], "headline-xl-mobile": ["Inter"], "numeric-stat": ["Inter"], "label-sm": ["Inter"] }, fontSize: { "headline-md": ["22px", { lineHeight: "28px", letterSpacing: "-0.015em", fontWeight: "600" }], "label-lg": ["17px", { lineHeight: "22px", letterSpacing: "-0.01em", fontWeight: "600" }], "headline-sm": ["20px", { lineHeight: "25px", letterSpacing: "-0.012em", fontWeight: "600" }], "label-md": ["15px", { lineHeight: "20px", letterSpacing: "-0.005em", fontWeight: "600" }], "headline-lg": ["28px", { lineHeight: "34px", letterSpacing: "-0.018em", fontWeight: "700" }], "body-sm": ["13px", { lineHeight: "18px", letterSpacing: "0em", fontWeight: "400" }], "body-lg": ["17px", { lineHeight: "22px", letterSpacing: "-0.01em", fontWeight: "400" }], "headline-xl": ["34px", { lineHeight: "41px", letterSpacing: "-0.022em", fontWeight: "700" }], "body-md": ["15px", { lineHeight: "20px", letterSpacing: "-0.005em", fontWeight: "400" }], "headline-xl-mobile": ["30px", { lineHeight: "36px", letterSpacing: "-0.02em", fontWeight: "700" }], "numeric-stat": ["24px", { lineHeight: "28px", letterSpacing: "-0.02em", fontWeight: "700" }], "label-sm": ["12px", { lineHeight: "16px", letterSpacing: "0.01em", fontWeight: "500" }] } } } };</script></head><body class="bg-surface text-on-surface antialiased flex flex-col min-h-screen"><header class="fixed top-0 w-full z-50 pt-safe bg-surface/80 backdrop-blur-xl shadow-[0_1px_8px_rgba(0,0,0,0.04)]"><div class="h-14 px-margin flex items-center justify-between"><button aria-label="Retour" class="w-11 h-11 -ml-space-xs rounded-full flex items-center justify-center text-primary active:scale-95 active:bg-surface-container transition-all" onclick="history.back()" type="button"><span class="material-symbols-outlined text-[24px]">arrow_back_ios_new</span></button><div class="flex items-center gap-space-xs"><span class="font-label-md text-label-md text-on-surface tracking-tight font-semibold">Vos informations</span></div><div class="w-11 h-11"></div></div></header><main class="flex-1 flex flex-col relative w-full pt-14 pb-safe bg-surface"><div class="flex flex-col w-full max-w-[430px] mx-auto px-margin pb-space-xl">
<div class="flex items-center gap-1.5 mt-space-sm mb-space-lg">
<div class="w-7 h-1.5 rounded-full bg-primary"></div>
<div class="w-2 h-1.5 rounded-full bg-surface-container-highest"></div>
<div class="w-2 h-1.5 rounded-full bg-surface-container-highest"></div>
</div>
<div class="space-y-space-xs mb-space-lg">
<h1 class="font-headline-lg text-headline-lg text-on-surface tracking-tight">Créez votre profil</h1>
<p class="font-body-md text-body-md text-on-surface-variant leading-relaxed">
      Renseignez vos coordonnées pour activer votre accès.
    </p>
</div>
<form class="flex flex-col gap-space-lg" id="onboarding-form" onsubmit="event.preventDefault();">
<div class="space-y-space-md">
<div class="space-y-space-xs">
<label class="font-label-sm text-label-sm text-on-surface font-semibold px-1">Identité</label>
<div class="bg-surface-container-lowest rounded-2xl shadow-sm overflow-hidden flex flex-col">
<div class="relative flex items-center px-4 py-3 bg-surface-container-lowest transition-colors">
<div class="flex-1 flex flex-col min-w-0">
<span class="font-label-sm text-label-sm text-on-surface-variant/70 -mb-0.5">Prénom</span>
<input autocomplete="given-name" class="w-full bg-transparent font-body-md text-body-md text-on-surface placeholder:text-outline-variant outline-none border-none p-0 focus:ring-0" id="prenom-input" name="first_name" placeholder="ex: Jean-Marc" required="" type="text">
</div>
</div>
<div class="h-[1px] bg-surface-container mx-4"></div>
<div class="relative flex items-center px-4 py-3 bg-surface-container-lowest transition-colors">
<div class="flex-1 flex flex-col min-w-0">
<span class="font-label-sm text-label-sm text-on-surface-variant/70 -mb-0.5">Nom de famille</span>
<input autocomplete="family-name" class="w-full bg-transparent font-body-md text-body-md text-on-surface placeholder:text-outline-variant outline-none border-none p-0 focus:ring-0" id="nom-input" name="last_name" placeholder="ex: Pierre" required="" type="text">
</div>
</div>
</div>
</div>
<div class="space-y-space-xs">
<label class="font-label-sm text-label-sm text-on-surface font-semibold px-1">Numéro de téléphone</label>
<div class="bg-surface-container-lowest rounded-2xl p-space-md shadow-sm">
<div class="flex items-center gap-2">
<div class="flex items-center gap-1.5 bg-surface-container-low px-3 py-2 rounded-xl shrink-0">
<span class="font-label-md text-label-md text-on-surface font-bold">+509</span>
</div>
<div class="flex-1 min-w-0 bg-surface-container-low px-3.5 py-2 rounded-xl focus-within:bg-surface-container transition-colors">
<input class="w-full bg-transparent font-label-lg text-label-lg tracking-wider text-on-surface placeholder:text-outline-variant outline-none border-none p-0 focus:ring-0 font-medium" id="phone-input" inputmode="numeric" maxlength="9" name="phone_number" placeholder="3712-3456" required="" type="tel">
</div>
</div>
</div>
</div>
</div>
<div class="sticky bottom-0 left-0 right-0 pt-space-md pb-space-sm bg-surface flex flex-col gap-3">
<button class="w-full h-[52px] rounded-full bg-primary text-on-primary font-label-lg text-label-lg shadow-sm flex items-center justify-center gap-2 transition-all active:scale-[0.98] select-none" id="submit-btn" type="submit">
<span>Continuer</span>
<span class="material-symbols-outlined text-[22px]">arrow_forward</span>
</button>
</div>
</form>
</div>
<script>
  function clearField(id) {
    const el = document.getElementById(id);
    if (el) {
      el.value = '';
      el.focus();
    }
  }

  // Haitian phone number auto-formatter (e.g. 3712-3456 or 4800-1234)
  const phoneInput = document.getElementById('phone-input');
  if (phoneInput) {
    phoneInput.addEventListener('input', function(e) {
      let value = e.target.value.replace(/\D/g, '');
      if (value.length > 8) value = value.substring(0, 8);
      
      if (value.length > 4) {
        e.target.value = value.substring(0, 4) + '-' + value.substring(4);
      } else {
        e.target.value = value;
      }
    });
  }

  // Form submission feedback
  const form = document.getElementById('onboarding-form');
  const btn = document.getElementById('submit-btn');
  if (form && btn) {
    form.addEventListener('submit', function() {
      const originalText = btn.innerHTML;
      btn.innerHTML = '<span class="material-symbols-outlined animate-spin text-[22px]">progress_activity</span><span>Configuration...</span>';
      btn.style.opacity = '0.85';

      const prenom = document.getElementById('prenom-input').value.trim();
      const nom = document.getElementById('nom-input').value.trim();
      const telephoneLocal = document.getElementById('phone-input').value.replace(/\D/g, '');
      const telephone = '509' + telephoneLocal;

      const commande = JSON.parse(localStorage.getItem('smarteco_commande') || '{}');
      localStorage.setItem('smarteco_commande', JSON.stringify({ ...commande, prenom, nom, telephone }));

      setTimeout(() => {
        window.location.href = '../choix_d_acc_s_smart.eco/code.html';
      }, 700);
    });
  }
</script></main>

</body></html>
