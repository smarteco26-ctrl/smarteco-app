<button class="bg-surface-container-high/80 text-primary hover:bg-primary-fixed active:scale-95 transition-all px-space-md py-2 rounded-full font-label-md text-label-md shadow-sm" onclick="handleChipClick(this)" type="button">

<div class="fixed bottom-0 inset-x-0 bg-surface/90 backdrop-blur-2xl p-space-sm pb-6 max-w-[430px] mx-auto z-40">
<form class="flex items-center gap-2" id="chat-input-form" onsubmit="event.preventDefault(); sendMessage();">

<input autocomplete="off" class="w-full bg-transparent text-on-surface placeholder:text-on-surface-variant font-body-md text-body-md outline-none border-none py-1.5" id="chat-message-input" placeholder="Décrivez votre problème..." type="text">
</div>
<button aria-label="Envoyer" class="w-12 h-12 rounded-full bg-gradient-to-r from-primary via-tertiary-container to-secondary text-on-primary flex items-center justify-center shadow-md active:scale-95 transition-transform flex-shrink-0" type="submit">
<span class="material-symbols-outlined text-[20px] ml-0.5">send</span>
</button>
</form>
</div>
</div>
<script>
  const SUPABASE_URL = "https://qdrarbfnbzirdevclgeg.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_M5gGWJgRMO-lTfm6bam28Q_UK55h4qo";
  const WHATSAPP_NUMBER = "50947971485";

  const commande = JSON.parse(localStorage.getItem('smarteco_commande') || '{}');
  const session = JSON.parse(localStorage.getItem('smarteco_session') || '{}');
  if (commande.prenom) {
    document.getElementById('greeting-text').innerHTML =
      `Bonjour <strong>${commande.prenom}</strong> ! Je suis SmartIA, l'assistant SMART.ECO. Comment puis-je vous aider ?`;
  }

  let historique = [];

  function handleChipClick(button) {
    const input = document.getElementById('chat-message-input');
    if (input) {
      input.value = button.innerText.trim();
      sendMessage();
    }
  }

  function scrollToBottom() {
    window.scrollTo(0, document.body.scrollHeight);
  }

  function ajouterMessageClient(texte) {
    const container = document.getElementById('chat-messages');
    const div = document.createElement('div');
    div.className = 'flex flex-col items-end max-w-[85%] self-end space-y-1';
    div.innerHTML = `
      <div class="bg-gradient-to-r from-primary to-primary-container text-on-primary rounded-2xl rounded-br-sm p-space-md shadow-sm">
        <p class="font-body-md text-body-md"></p>
      </div>`;
    div.querySelector('p').textContent = texte;
    container.appendChild(div);
    scrollToBottom();
  }

  function ajouterMessageIA(texte) {
    const container = document.getElementById('chat-messages');
    const div = document.createElement('div');
    div.className = 'flex items-end gap-space-sm max-w-[92%] self-start';
    div.innerHTML = `
      <div class="w-8 h-8 rounded-full bg-primary-fixed flex items-center justify-center flex-shrink-0 text-on-primary-fixed shadow-sm">
        <span class="material-symbols-outlined text-[18px]">smart_toy</span>
      </div>
      <div class="flex flex-col space-y-1">
        <div class="bg-surface-container-lowest text-on-surface rounded-2xl rounded-bl-sm p-space-md shadow-sm">
          <p class="font-body-md text-body-md leading-relaxed"></p>
        </div>
      </div>`;
    div.querySelector('p').textContent = texte;
    container.appendChild(div);
    scrollToBottom();
  }

  function ajouterBulleTyping() {
    const container = document.getElementById('chat-messages');
    const div = document.createElement('div');
    div.id = 'typing-bubble';
    div.className = 'flex items-end gap-space-sm max-w-[92%] self-start';
    div.innerHTML = `
      <div class="w-8 h-8 rounded-full bg-primary-fixed flex items-center justify-center flex-shrink-0 text-on-primary-fixed shadow-sm">
        <span class="material-symbols-outlined text-[18px]">smart_toy</span>
      </div>
      <div class="bg-surface-container-lowest rounded-2xl rounded-bl-sm p-space-md shadow-sm flex gap-1 items-center">
        <span class="w-1.5 h-1.5 rounded-full bg-on-surface-variant animate-bounce" style="animation-delay:0ms"></span>
        <span class="w-1.5 h-1.5 rounded-full bg-on-surface-variant animate-bounce" style="animation-delay:150ms"></span>
        <span class="w-1.5 h-1.5 rounded-full bg-on-surface-variant animate-bounce" style="animation-delay:300ms"></span>
      </div>`;
    container.appendChild(div);
    scrollToBottom();
  }

  function retirerBulleTyping() {
    document.getElementById('typing-bubble')?.remove();
  }

  function ajouterBoutonWhatsApp() {
    const container = document.getElementById('chat-messages');
    const div = document.createElement('div');
    div.className = 'bg-surface-container-low rounded-2xl p-space-md shadow-sm mt-space-sm flex flex-col gap-space-sm';
    div.innerHTML = `
      <div class="flex items-start gap-space-sm">
        <div class="w-10 h-10 rounded-full bg-secondary-container flex items-center justify-center flex-shrink-0 text-on-secondary-container">
          <span class="material-symbols-outlined text-[22px]">engineering</span>
        </div>
        <div class="flex flex-col min-w-0">
          <h3 class="font-headline-sm text-headline-sm text-on-surface">Ce problème nécessite l'équipe SMART.ECO</h3>
          <p class="font-body-sm text-body-sm text-on-surface-variant mt-0.5">Contactez directement l'administration pour une résolution rapide.</p>
        </div>
      </div>
      <a class="w-full h-[52px] bg-secondary text-on-secondary rounded-full flex items-center justify-center gap-2.5 px-space-md shadow-md active:scale-[0.98] transition-transform" href="https://wa.me/${WHATSAPP_NUMBER}" rel="noopener noreferrer" target="_blank">
        <svg class="w-6 h-6 fill-current" viewBox="0 0 24 24"><path d="M12.031 6.172c-3.181 0-5.767 2.586-5.768 5.766-.001 1.298.38 2.27 1.019 3.287l-.711 2.592 2.654-.696c.969.586 1.761.853 2.806.853h.005c3.182 0 5.768-2.587 5.768-5.766.001-3.182-2.585-5.766-5.773-5.766zm8.847 5.766c0 4.887-3.978 8.863-8.878 8.863-1.47 0-2.894-.367-4.159-1.031l-5.841 1.531 1.558-5.691c-.742-1.312-1.135-2.809-1.135-4.343 0-4.889 3.978-8.864 8.877-8.864 4.898 0 8.878 3.975 8.878 8.864z"></path></svg>
        <span class="font-label-lg text-label-lg font-semibold tracking-wide">Contacter l'administration sur WhatsApp</span>
      </a>`;
    container.appendChild(div);
    scrollToBottom();
  }

  async function sendMessage() {
    const input = document.getElementById('chat-message-input');
    const texte = input.value.trim();
    if (!texte) return;
    input.value = '';

    ajouterMessageClient(texte);
    historique.push({ role: 'user', content: texte });
    ajouterBulleTyping();

    try {
      const res = await fetch(`${SUPABASE_URL}/functions/v1/smartia-chat`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
          'apikey': SUPABASE_ANON_KEY,
        },
        body: JSON.stringify({
          messages: historique,
          client: {
            prenom: commande.prenom,
            telephone: commande.telephone,
            forfait: session?.forfait || null,
          },
        }),
      });
      const data = await res.json();
      retirerBulleTyping();

      const reponse = data.reponse || "Désolé, je n'ai pas pu traiter votre demande.";
      ajouterMessageIA(reponse);
      historique.push({ role: 'assistant', content: reponse });

      if (data.escalade) {
        ajouterBoutonWhatsApp();
      }
    } catch (e) {
      console.error(e);
      retirerBulleTyping();
      ajouterMessageIA("Une erreur est survenue. Réessayez, ou contactez l'équipe directement.");
      ajouterBoutonWhatsApp();
    }
  }
</script></main>
