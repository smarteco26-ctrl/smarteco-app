<section class="flex flex-col gap-space-md">
<div class="relative flex items-center w-full">
<span class="material-symbols-outlined absolute left-4 text-outline text-[22px] pointer-events-none">search</span>
<input class="w-full h-12 pl-12 pr-4 rounded-full bg-surface-container-low text-on-surface placeholder:text-outline font-body-md text-body-md shadow-sm focus:outline-none focus:bg-surface-container transition-all" placeholder="Rechercher une question..." type="search">
</div>
<button class="w-full h-12 rounded-full bg-primary text-on-primary font-label-lg text-label-lg shadow-sm flex items-center justify-center gap-2 active:scale-[0.98] transition-all" id="toggle-composer-btn" type="button">
<span class="material-symbols-outlined text-[22px]">add_circle</span>
<span class="">Nouvelle question</span>
</button>
<div class="hidden flex-col gap-2 p-3 rounded-2xl bg-surface-container-low shadow-sm" id="composer">
<textarea class="w-full min-h-[80px] rounded-xl bg-surface-container-lowest p-3 font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant focus:outline-none focus:ring-2 focus:ring-primary resize-none" id="composer-textarea" placeholder="Posez votre question... (tapez @SmartIA pour une réponse automatique)"></textarea>
<div class="flex justify-end gap-2">
<button class="px-4 py-2 rounded-full text-on-surface-variant font-label-sm text-label-sm" id="cancel-composer-btn" type="button">Annuler</button>
<button class="px-4 py-2 rounded-full bg-primary text-on-primary font-label-sm text-label-sm font-semibold" id="submit-composer-btn" type="button">Publier</button>
</div>
</div>
</section>
<!-- Fil réel (chargé depuis Supabase) -->
<section class="flex flex-col gap-4" id="real-feed"></section>
<!-- Community Guidelines Friendly Footer Note -->
<div class="flex items-center justify-center gap-2 p-3 text-center">
<span class="material-symbols-outlined text-[18px] text-outline">shield</span>
<span class="font-body-sm text-body-sm text-outline">Entraide respectueuse &amp; solutions vérifiées SMART.ECO</span>
</div>
</div>
<script>
  const SUPABASE_URL = "https://qdrarbfnbzirdevclgeg.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_M5gGWJgRMO-lTfm6bam28Q_UK55h4qo";

  const commande = JSON.parse(localStorage.getItem('smarteco_commande') || '{}');

  // Composeur
  const toggleBtn = document.getElementById('toggle-composer-btn');
  const composer = document.getElementById('composer');
  const textarea = document.getElementById('composer-textarea');

  toggleBtn.addEventListener('click', () => {
    composer.classList.toggle('hidden');
    composer.classList.toggle('flex');
    if (!composer.classList.contains('hidden')) textarea.focus();
  });
  document.getElementById('cancel-composer-btn').addEventListener('click', () => {
    composer.classList.add('hidden');
    composer.classList.remove('flex');
    textarea.value = '';
  });
  document.getElementById('submit-composer-btn').addEventListener('click', async () => {
    const texte = textarea.value.trim();
    if (!texte) return;
    await publierPost(texte, null);
    textarea.value = '';
    composer.classList.add('hidden');
    composer.classList.remove('flex');
  });

  async function publierPost(texte, parentId) {
    try {
      await fetch(`${SUPABASE_URL}/functions/v1/community-post`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
          'apikey': SUPABASE_ANON_KEY,
        },
        body: JSON.stringify({
          texte,
          prenom: commande.prenom || 'Client',
          telephone: commande.telephone || null,
          parentId: parentId || undefined,
        }),
      });
    } finally {
      chargerFil();
    }
  }

  function tempsEcoule(dateStr) {
    const diffMin = Math.round((Date.now() - new Date(dateStr).getTime()) / 60000);
    if (diffMin < 1) return "à l'instant";
    if (diffMin < 60) return `${diffMin} min`;
    const diffH = Math.round(diffMin / 60);
    if (diffH < 24) return `${diffH} h`;
    return `${Math.round(diffH / 24)} j`;
  }

  function rendreReponse(reponse) {
    if (reponse.est_ia) {
      return `
        <div class="relative flex flex-col p-4 rounded-2xl bg-surface-container-lowest shadow-sm mt-3 overflow-hidden">
          <div class="absolute left-0 top-0 bottom-0 w-1.5 bg-gradient-to-b from-primary via-primary-container to-secondary"></div>
          <div class="flex items-center gap-2 mb-2">
            <div class="w-7 h-7 rounded-full bg-gradient-to-tr from-primary to-secondary flex items-center justify-center text-on-primary shadow-xs">
              <span class="material-symbols-outlined text-[16px]">auto_awesome</span>
            </div>
            <span class="font-label-sm text-label-sm text-primary font-bold tracking-tight">SmartIA</span>
          </div>
          <p class="font-body-md text-body-md text-on-surface"></p>
        </div>`;
    }
    return `
      <div class="mt-3 pl-4 border-l-2 border-surface-container">
        <div class="flex items-center gap-1.5 mb-1">
          <span class="font-label-sm text-label-sm text-on-surface font-semibold"></span>
          <span class="font-body-sm text-body-sm text-outline"></span>
        </div>
        <p class="font-body-md text-body-md text-on-surface"></p>
      </div>`;
  }

  function rendrePost(post, reponses) {
    const article = document.createElement('article');
    article.className = 'flex flex-col p-4 rounded-[22px] bg-surface-container-low shadow-sm';
    article.innerHTML = `
      <div class="flex items-center justify-between mb-3">
        <span class="font-label-md text-label-md text-on-surface font-semibold" data-role="auteur"></span>
        <span class="font-body-sm text-body-sm text-outline" data-role="temps"></span>
      </div>
      <p class="font-body-md text-body-md text-on-surface leading-snug mb-1" data-role="texte"></p>
      <div data-role="reponses"></div>
      <div class="pt-2">
        <button class="px-3.5 py-1.5 rounded-full bg-surface-container text-primary font-label-sm text-label-sm font-semibold" data-role="repondre-btn" type="button">Répondre</button>
        <div class="hidden mt-2 flex-col gap-2" data-role="reponse-form">
          <textarea class="w-full min-h-[60px] rounded-xl bg-surface-container-lowest p-3 font-body-sm text-body-sm focus:outline-none focus:ring-2 focus:ring-primary resize-none" placeholder="Votre réponse... (@SmartIA pour taguer l'IA)"></textarea>
          <button class="self-end px-4 py-1.5 rounded-full bg-primary text-on-primary font-label-sm text-label-sm font-semibold">Envoyer</button>
        </div>
      </div>`;

    article.querySelector('[data-role="auteur"]').textContent = post.prenom;
    article.querySelector('[data-role="temps"]').textContent = tempsEcoule(post.created_at);
    article.querySelector('[data-role="texte"]').textContent = post.texte;

    const reponsesEl = article.querySelector('[data-role="reponses"]');
    reponses.forEach(r => {
      const wrapper = document.createElement('div');
      wrapper.innerHTML = rendreReponse(r);
      const node = wrapper.firstElementChild;
      if (r.est_ia) {
        node.querySelector('p').textContent = r.texte;
      } else {
        const spans = node.querySelectorAll('span');
        spans[0].textContent = r.prenom;
        spans[1].textContent = tempsEcoule(r.created_at);
        node.querySelector('p').textContent = r.texte;
      }
      reponsesEl.appendChild(node);
    });

    const repondreBtn = article.querySelector('[data-role="repondre-btn"]');
    const reponseForm = article.querySelector('[data-role="reponse-form"]');
    repondreBtn.addEventListener('click', () => {
      reponseForm.classList.toggle('hidden');
      reponseForm.classList.toggle('flex');
    });
    reponseForm.querySelector('button').addEventListener('click', async () => {
      const ta = reponseForm.querySelector('textarea');
      const texte = ta.value.trim();
      if (!texte) return;
      await publierPost(texte, post.id);
    });

    return article;
  }

  async function chargerFil() {
    const container = document.getElementById('real-feed');
    try {
      const res = await fetch(
        `${SUPABASE_URL}/rest/v1/communaute_posts?select=*&order=created_at.asc`,
        { headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` } }
      );
      const tous = await res.json();
      if (!Array.isArray(tous)) throw new Error('réponse invalide');

      const racines = tous.filter(p => !p.parent_id).sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
      container.innerHTML = '';

      if (racines.length === 0) {
        container.innerHTML = `<p class="font-body-sm text-body-sm text-on-surface-variant text-center py-6">Aucune question pour l'instant. Soyez le premier à en poser une !</p>`;
        return;
      }

      racines.forEach(post => {
        const reponses = tous.filter(p => p.parent_id === post.id).sort((a, b) => new Date(a.created_at) - new Date(b.created_at));
        container.appendChild(rendrePost(post, reponses));
      });
    } catch (e) {
      console.error(e);
      container.innerHTML = `<p class="font-body-sm text-body-sm text-on-surface-variant text-center py-6">Impossible de charger le fil pour l'instant.</p>`;
    }
  }

  chargerFil();
</script></main><nav class="fixed bottom-0 w-full z-50 pb-safe bg-surface/85 backdrop-blur-xl shadow-[0_-2px_12px_rgba(0,0,0,0.04)]" data-active-classes="text-primary font-semibold"><div class="max-w-[430px] mx-auto px-gutter-sm flex justify-around items-center h-16"><a class="flex flex-col items-center justify-center gap-0.5 min-w-[56px] min-h-[44px] text-on-surface-variant hover:text-on-surface transition-all active:scale-95" data-path="accueil" onclick="window.location.href='../accueil_smart.eco/code.html'" href="#"><span class="material-symbols-outlined text-[24px]">home</span><span class="font-label-sm text-label-sm">Accueil</span></a><a class="flex flex-col items-center justify-center gap-0.5 min-w-[56px] min-h-[44px] text-on-surface-variant hover:text-on-surface transition-all active:scale-95" data-path="communaute" onclick="window.location.href='../communaut_smart.eco/code.html'" href="#"><span class="material-symbols-outlined text-[24px]">forum</span><span class="font-label-sm text-label-sm">Communauté</span></a><a class="flex flex-col items-center justify-center gap-0.5 min-w-[56px] min-h-[44px] text-on-surface-variant hover:text-on-surface transition-all active:scale-95" data-path="forfaits" onclick="window.location.href='../forfaits_smart.eco/code.html'" href="#"><span class="material-symbols-outlined text-[24px]">bolt</span><span class="font-label-sm text-label-sm">Forfaits</span></a><a class="flex flex-col items-center justify-center gap-0.5 min-w-[56px] min-h-[44px] text-on-surface-variant hover:text-on-surface transition-all active:scale-95" data-path="bientot" onclick="window.location.href='../bient_t_smart.eco/code.html'" href="#"><span class="material-symbols-outlined text-[24px]">auto_awesome</span><span class="font-label-sm text-label-sm">Bientôt</span></a></div><div aria-hidden="true" class="w-32 h-1 bg-on-surface/20 rounded-full mx-auto my-1.5"></div></nav>
