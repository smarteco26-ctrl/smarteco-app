<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport">
<title>Communauté — SMART.ECO Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script id="tailwind-config">tailwind.config = { theme: { extend: { colors: { primary: "#006098", surface: "#faf8ff", "surface-container": "#eaedff", "surface-lowest": "#ffffff", "on-surface": "#131b2e", "on-surface-variant": "#3f4851", error: "#ba1a1a", "error-container": "#ffdad6" } } } };</script>
<style>body{font-family:'Inter',sans-serif;background:#faf8ff;margin:0;}</style>
</head><body class="min-h-screen flex flex-col">

<header class="sticky top-0 bg-surface/90 backdrop-blur-xl shadow-sm z-10">
<div class="max-w-lg mx-auto px-4 h-14 flex items-center justify-between">
<h1 class="font-bold text-on-surface">Communauté</h1>
<span class="text-xs text-on-surface-variant" id="admin-name"></span>
</div>
<div class="max-w-lg mx-auto px-4 flex gap-4 border-t border-surface-container overflow-x-auto">
<a class="py-2.5 text-sm text-on-surface-variant whitespace-nowrap" href="../paiements/index.html">Paiements</a>
<a class="py-2.5 text-sm text-on-surface-variant whitespace-nowrap" href="../clients/index.html">Clients</a>
<a class="py-2.5 text-sm text-on-surface-variant whitespace-nowrap" href="../nouveau/index.html">Nouveau voucher</a>
<a class="py-2.5 text-sm text-on-surface-variant whitespace-nowrap" href="../tarifs/index.html">Tarifs</a>
<a class="py-2.5 text-sm font-semibold text-primary border-b-2 border-primary whitespace-nowrap" href="index.html">Communauté</a>
</div>
</header>

<main class="flex-1 max-w-lg w-full mx-auto px-4 py-4">
<div class="flex flex-col gap-3" id="liste"></div>
</main>

<script>
  const SUPABASE_URL = "https://qdrarbfnbzirdevclgeg.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_M5gGWJgRMO-lTfm6bam28Q_UK55h4qo";
  const token = localStorage.getItem('smarteco_admin_token');
  if (!token) window.location.href = '../login/index.html';
  document.getElementById('admin-name').textContent = localStorage.getItem('smarteco_admin_nom') || '';

  let tous = [];

  async function charger() {
    const res = await fetch(`${SUPABASE_URL}/functions/v1/admin-community`, {
      headers: { 'Authorization': `Bearer ${SUPABASE_ANON_KEY}`, 'apikey': SUPABASE_ANON_KEY },
    });
    const data = await res.json();
    tous = data.posts || [];
    rendre();
  }

  function rendre() {
    const racines = tous.filter(p => !p.parent_id).sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
    const el = document.getElementById('liste');
    if (racines.length === 0) {
      el.innerHTML = `<p class="text-center text-sm text-on-surface-variant py-8">Aucune question.</p>`;
      return;
    }
    el.innerHTML = racines.map(post => {
      const reponses = tous.filter(p => p.parent_id === post.id);
      return `
      <div class="bg-surface-lowest rounded-2xl shadow-sm p-4">
        <div class="flex items-center justify-between mb-1">
          <span class="font-semibold text-on-surface">${post.prenom}</span>
          <button class="text-error text-xs font-semibold" onclick="supprimer('${post.id}')">Supprimer</button>
        </div>
        <p class="text-sm text-on-surface-variant mb-2">${post.texte}</p>
        ${reponses.map(r => `
          <div class="pl-3 border-l-2 border-surface-container mb-1 flex items-start justify-between gap-2">
            <div>
              <span class="text-xs font-semibold text-on-surface">${r.prenom}${r.est_ia ? ' (SmartIA)' : ''}</span>
              <p class="text-xs text-on-surface-variant">${r.texte}</p>
            </div>
            <button class="text-error text-xs font-semibold shrink-0" onclick="supprimer('${r.id}')">✕</button>
          </div>
        `).join('')}
        <div class="flex gap-2 mt-2">
          <input class="flex-1 h-9 px-3 rounded-full bg-surface-container text-sm outline-none" id="reponse-${post.id}" placeholder="Répondre en tant qu'équipe...">
          <button class="px-3 h-9 rounded-full bg-primary text-white text-sm font-semibold" onclick="repondre('${post.id}')">Envoyer</button>
        </div>
      </div>`;
    }).join('');
  }

  window.supprimer = async function(postId) {
    if (!confirm('Supprimer ce message ?')) return;
    await fetch(`${SUPABASE_URL}/functions/v1/admin-community`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${SUPABASE_ANON_KEY}`, 'apikey': SUPABASE_ANON_KEY },
      body: JSON.stringify({ token, action: 'supprimer', postId }),
    });
    charger();
  };

  window.repondre = async function(postId) {
    const input = document.getElementById(`reponse-${postId}`);
    const texte = input.value.trim();
    if (!texte) return;
    await fetch(`${SUPABASE_URL}/functions/v1/admin-community`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${SUPABASE_ANON_KEY}`, 'apikey': SUPABASE_ANON_KEY },
      body: JSON.stringify({ token, action: 'repondre', postId, texte }),
    });
    input.value = '';
    charger();
  };

  charger();
</script>

</body></html>
