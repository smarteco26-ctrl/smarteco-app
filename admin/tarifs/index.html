<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport">
<title>Tarifs — SMART.ECO Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script id="tailwind-config">tailwind.config = { theme: { extend: { colors: { primary: "#006098", surface: "#faf8ff", "surface-container": "#eaedff", "surface-lowest": "#ffffff", "on-surface": "#131b2e", "on-surface-variant": "#3f4851", secondary: "#006d3c", "secondary-container": "#72fda8" } } } };</script>
<style>body{font-family:'Inter',sans-serif;background:#faf8ff;margin:0;}</style>
</head><body class="min-h-screen flex flex-col">

<header class="sticky top-0 bg-surface/90 backdrop-blur-xl shadow-sm z-10">
<div class="max-w-lg mx-auto px-4 h-14 flex items-center justify-between">
<h1 class="font-bold text-on-surface">Tarifs</h1>
<span class="text-xs text-on-surface-variant" id="admin-name"></span>
</div>
<div class="max-w-lg mx-auto px-4 flex gap-4 border-t border-surface-container overflow-x-auto">
<a class="py-2.5 text-sm text-on-surface-variant whitespace-nowrap" href="../dashboard/index.html">Tableau de bord</a>
<a class="py-2.5 text-sm text-on-surface-variant whitespace-nowrap" href="../paiements/index.html">Paiements</a>
<a class="py-2.5 text-sm text-on-surface-variant whitespace-nowrap" href="../clients/index.html">Clients</a>
<a class="py-2.5 text-sm text-on-surface-variant whitespace-nowrap" href="../nouveau/index.html">Nouveau voucher</a>
<a class="py-2.5 text-sm font-semibold text-primary border-b-2 border-primary whitespace-nowrap" href="index.html">Tarifs</a>
<a class="py-2.5 text-sm text-on-surface-variant whitespace-nowrap" href="../communaute/index.html">Communauté</a>
</div>
</header>

<main class="flex-1 max-w-lg w-full mx-auto px-4 py-4">
<p class="text-sm text-on-surface-variant mb-4">Modifiez un prix puis validez. Le changement s'applique immédiatement dans l'app.</p>
<div class="flex flex-col gap-3" id="liste"></div>
</main>

<script>
  const SUPABASE_URL = "https://qdrarbfnbzirdevclgeg.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_M5gGWJgRMO-lTfm6bam28Q_UK55h4qo";
  const token = localStorage.getItem('smarteco_admin_token');
  if (!token) window.location.href = '../login/index.html';
  document.getElementById('admin-name').textContent = localStorage.getItem('smarteco_admin_nom') || '';

  async function charger() {
    const res = await fetch(`${SUPABASE_URL}/functions/v1/admin-plans`, {
      headers: { 'Authorization': `Bearer ${SUPABASE_ANON_KEY}`, 'apikey': SUPABASE_ANON_KEY },
    });
    const data = await res.json();
    rendre(data.plans || []);
  }

  function rendre(plans) {
    const el = document.getElementById('liste');
    el.innerHTML = plans.map(p => `
      <div class="bg-surface-lowest rounded-2xl shadow-sm p-4">
        <div class="flex items-center justify-between mb-2">
          <span class="font-semibold text-on-surface">${p.label}</span>
          <span class="text-xs text-on-surface-variant">par ${p.unite}</span>
        </div>
        <div class="flex items-center gap-2">
          <input class="flex-1 h-11 px-3 rounded-xl bg-surface-container outline-none text-on-surface" data-plan="${p.id}" type="number" value="${p.prix_unitaire}">
          <span class="text-sm text-on-surface-variant">HTG</span>
          <button class="save-btn h-11 px-4 rounded-full bg-primary text-white text-sm font-semibold" data-plan="${p.id}">Enregistrer</button>
        </div>
      </div>
    `).join('');

    document.querySelectorAll('.save-btn').forEach(btn => {
      btn.addEventListener('click', async () => {
        const planId = btn.dataset.plan;
        const input = document.querySelector(`input[data-plan="${planId}"]`);
        const prix_unitaire = input.value;
        btn.textContent = '...';
        const res = await fetch(`${SUPABASE_URL}/functions/v1/admin-plans`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
            'apikey': SUPABASE_ANON_KEY,
          },
          body: JSON.stringify({ token, planId, prix_unitaire }),
        });
        const data = await res.json();
        btn.textContent = data.ok ? 'Enregistré ✓' : 'Erreur';
        setTimeout(() => { btn.textContent = 'Enregistrer'; }, 1500);
      });
    });
  }

  charger();
</script>

</body></html>
