<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport">
<title>Paiements — SMART.ECO Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script id="tailwind-config">tailwind.config = { theme: { extend: { colors: { primary: "#006098", surface: "#faf8ff", "surface-container": "#eaedff", "surface-low": "#f2f3ff", "surface-lowest": "#ffffff", "on-surface": "#131b2e", "on-surface-variant": "#3f4851", error: "#ba1a1a", "error-container": "#ffdad6", secondary: "#006d3c", "secondary-container": "#72fda8" } } } };</script>
<style>body{font-family:'Inter',sans-serif;background:#faf8ff;margin:0;}</style>
</head><body class="min-h-screen flex flex-col">

<header class="sticky top-0 bg-surface/90 backdrop-blur-xl shadow-sm z-10">
<div class="max-w-lg mx-auto px-4 h-14 flex items-center justify-between">
<h1 class="font-bold text-on-surface">Paiements</h1>
<span class="text-xs text-on-surface-variant" id="admin-name"></span>
</div>
<div class="max-w-lg mx-auto px-4 flex gap-4 border-t border-surface-container">
<a class="py-2.5 text-sm font-semibold text-primary border-b-2 border-primary" href="index.html">Paiements</a>
<a class="py-2.5 text-sm text-on-surface-variant" href="../clients/index.html">Clients</a>
</div>
</header>

<main class="flex-1 max-w-lg w-full mx-auto px-4 py-4">
<div class="flex gap-2 mb-4" id="filtres">
<button class="filtre-btn px-3 py-1.5 rounded-full text-sm font-semibold bg-primary text-white" data-statut="en_attente">En attente</button>
<button class="filtre-btn px-3 py-1.5 rounded-full text-sm bg-surface-container text-on-surface-variant" data-statut="valide">Validés</button>
<button class="filtre-btn px-3 py-1.5 rounded-full text-sm bg-surface-container text-on-surface-variant" data-statut="refuse">Refusés</button>
</div>
<div class="flex flex-col gap-3" id="liste"></div>
</main>

<script>
  const SUPABASE_URL = "https://qdrarbfnbzirdevclgeg.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_M5gGWJgRMO-lTfm6bam28Q_UK55h4qo";
  const token = localStorage.getItem('smarteco_admin_token');
  if (!token) window.location.href = '../login/index.html';

  document.getElementById('admin-name').textContent = localStorage.getItem('smarteco_admin_nom') || '';

  let tous = [];
  let filtreActif = 'en_attente';

  async function charger() {
    const res = await fetch(`${SUPABASE_URL}/functions/v1/admin-payments?token=${encodeURIComponent(token)}`, {
      headers: { 'Authorization': `Bearer ${SUPABASE_ANON_KEY}`, 'apikey': SUPABASE_ANON_KEY },
    });
    if (res.status === 401) { window.location.href = '../login/index.html'; return; }
    const data = await res.json();
    tous = data.paiements || [];
    rendre();
  }

  function rendre() {
    const liste = document.getElementById('liste');
    const filtres = tous.filter(p => p.statut === filtreActif);
    if (filtres.length === 0) {
      liste.innerHTML = `<p class="text-center text-sm text-on-surface-variant py-8">Aucun paiement ${filtreActif === 'en_attente' ? 'en attente' : filtreActif === 'valide' ? 'validé' : 'refusé'}.</p>`;
      return;
    }
    liste.innerHTML = filtres.map(p => `
      <div class="bg-surface-lowest rounded-2xl shadow-sm p-4">
        <div class="flex items-center justify-between mb-2">
          <span class="font-semibold text-on-surface">${p.client_telephone}</span>
          <span class="text-xs text-on-surface-variant">${new Date(p.created_at).toLocaleString('fr-FR')}</span>
        </div>
        <div class="text-sm text-on-surface-variant space-y-0.5 mb-3">
          <div>Forfait : ${p.plan_id} × ${p.quantite}</div>
          <div>Montant attendu : ${p.montant_attendu} HTG ${p.montant_detecte ? `(détecté : ${p.montant_detecte} HTG)` : ''}</div>
          <div>Méthode : ${p.methode} — Expéditeur : ${p.numero_expediteur}</div>
          ${p.motif_refus ? `<div class="text-error">Motif : ${p.motif_refus}</div>` : ''}
        </div>
        ${filtreActif === 'en_attente' ? `
          <div class="flex gap-2">
            <button class="flex-1 h-10 rounded-full bg-secondary-container text-secondary font-semibold text-sm" onclick="decider('${p.id}','valider')">Valider</button>
            <button class="flex-1 h-10 rounded-full bg-error-container text-error font-semibold text-sm" onclick="decider('${p.id}','refuser')">Refuser</button>
          </div>` : ''}
      </div>
    `).join('');
  }

  window.decider = async function(proofId, action) {
    const res = await fetch(`${SUPABASE_URL}/functions/v1/admin-payments`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
        'apikey': SUPABASE_ANON_KEY,
      },
      body: JSON.stringify({ token, action, proofId }),
    });
    const data = await res.json();
    if (data.ok) charger();
    else alert("Erreur : " + (data.erreur || 'inconnue'));
  };

  document.querySelectorAll('.filtre-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.filtre-btn').forEach(b => {
        b.classList.remove('bg-primary', 'text-white');
        b.classList.add('bg-surface-container', 'text-on-surface-variant');
      });
      btn.classList.add('bg-primary', 'text-white');
      btn.classList.remove('bg-surface-container', 'text-on-surface-variant');
      filtreActif = btn.dataset.statut;
      rendre();
    });
  });

  charger();
  setInterval(charger, 15000);
</script>

</body></html>
