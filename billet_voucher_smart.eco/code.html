<!DOCTYPE html><html class="h-full" lang="fr"><head><meta charset="utf-8"><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"><meta content="mobile_stack" name="shell-type"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { colors: { "surface-container-lowest": "#ffffff", "surface-bright": "#faf8ff", "on-primary-fixed": "#001d33", "tertiary-container": "#3975c2", "on-surface": "#131b2e", "on-surface-variant": "#3f4851", "surface-dim": "#d2d9f4", "surface-variant": "#dae2fd", "secondary": "#006d3c", "primary": "#006098", "tertiary-fixed": "#d5e3ff", "on-secondary-fixed": "#00210e", "error-container": "#ffdad6", "on-primary-fixed-variant": "#004a77", "inverse-surface": "#283044", "on-tertiary-container": "#fefcff", "tertiary-fixed-dim": "#a6c8ff", "surface-container-high": "#e2e7ff", "error": "#ba1a1a", "on-error-container": "#93000a", "surface-tint": "#00639c", "on-secondary": "#ffffff", "on-secondary-container": "#007440", "on-primary-container": "#fdfcff", "on-tertiary": "#ffffff", "inverse-primary": "#98cbff", "background": "#faf8ff", "outline-variant": "#bfc7d3", "surface-container-low": "#f2f3ff", "on-primary": "#ffffff", "on-tertiary-fixed-variant": "#004787", "on-tertiary-fixed": "#001c3b", "primary-fixed": "#cfe5ff", "on-secondary-fixed-variant": "#00522c", "inverse-on-surface": "#eef0ff", "surface-container-highest": "#dae2fd", "tertiary": "#145ca7", "outline": "#707882", "surface": "#faf8ff", "primary-fixed-dim": "#98cbff", "on-error": "#ffffff", "primary-container": "#007abf", "surface-container": "#eaedff", "secondary-fixed": "#72fda8", "secondary-fixed-dim": "#52df8e", "on-background": "#131b2e", "secondary-container": "#72fda8" }, borderRadius: { DEFAULT: "1rem", lg: "2rem", xl: "3rem", full: "9999px" }, spacing: { "margin-desktop": "2rem", "space-md": "1rem", "gutter": "1rem", "space-sm": "0.5rem", "margin": "1rem", "space-xs": "0.25rem", "space-lg": "1.5rem", "space-xl": "2rem", "gutter-sm": "0.75rem" }, fontFamily: { "headline-md": ["Inter"], "label-lg": ["Inter"], "headline-sm": ["Inter"], "label-md": ["Inter"], "headline-lg": ["Inter"], "body-sm": ["Inter"], "body-lg": ["Inter"], "headline-xl": ["Inter"], "body-md": ["Inter"], "headline-xl-mobile": ["Inter"], "numeric-stat": ["Inter"], "label-sm": ["Inter"] }, fontSize: { "headline-md": ["22px", { lineHeight: "28px", letterSpacing: "-0.015em", fontWeight: "600" }], "label-lg": ["17px", { lineHeight: "22px", letterSpacing: "-0.01em", fontWeight: "600" }], "headline-sm": ["20px", { lineHeight: "25px", letterSpacing: "-0.012em", fontWeight: "600" }], "label-md": ["15px", { lineHeight: "20px", letterSpacing: "-0.005em", fontWeight: "600" }], "headline-lg": ["28px", { lineHeight: "34px", letterSpacing: "-0.018em", fontWeight: "700" }], "body-sm": ["13px", { lineHeight: "18px", letterSpacing: "0em", fontWeight: "400" }], "body-lg": ["17px", { lineHeight: "22px", letterSpacing: "-0.01em", fontWeight: "400" }], "headline-xl": ["34px", { lineHeight: "41px", letterSpacing: "-0.022em", fontWeight: "700" }], "body-md": ["15px", { lineHeight: "20px", letterSpacing: "-0.005em", fontWeight: "400" }], "headline-xl-mobile": ["30px", { lineHeight: "36px", letterSpacing: "-0.02em", fontWeight: "700" }], "numeric-stat": ["24px", { lineHeight: "28px", letterSpacing: "-0.02em", fontWeight: "700" }], "label-sm": ["12px", { lineHeight: "16px", letterSpacing: "0.01em", fontWeight: "500" }] } } } };</script><style>body{min-height:max(884px,100dvh);}</style></head><body class="bg-surface text-on-surface antialiased flex flex-col min-h-screen">

<header class="fixed top-0 w-full z-50 pt-safe bg-surface/80 backdrop-blur-xl shadow-[0_1px_8px_rgba(0,0,0,0.04)]"><div class="h-14 px-margin flex items-center justify-between"><button aria-label="Retour" class="w-11 h-11 -ml-space-xs rounded-full flex items-center justify-center text-primary active:scale-95 active:bg-surface-container transition-all" onclick="window.location.href='../accueil_smart.eco/code.html'" type="button"><span class="material-symbols-outlined text-[24px]">close</span></button><span class="font-label-md text-label-md text-on-surface tracking-tight font-semibold">Votre voucher</span><div class="w-11 h-11"></div></div></header>

<main class="flex-1 flex flex-col relative w-full pt-14 pb-space-xl bg-surface">
<div class="flex flex-col w-full max-w-[430px] mx-auto px-margin">

<div class="flex flex-col items-center text-center mt-space-md mb-space-lg">
<div class="w-16 h-16 rounded-full bg-secondary-container flex items-center justify-center mb-space-sm">
<span class="material-symbols-outlined text-on-secondary-container text-[32px]">check</span>
</div>
<span class="font-headline-md text-headline-md text-on-surface tracking-tight">Paiement réussi</span>
<p class="font-body-md text-body-md text-on-surface-variant mt-space-xs" id="plan-nom">Votre accès est prêt</p>
</div>

<div class="w-full rounded-2xl bg-surface-container-lowest shadow-sm overflow-hidden mb-space-lg">
<div class="p-space-lg flex flex-col items-center gap-space-xs">
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider">Code voucher</span>
<span class="font-numeric-stat text-[28px] text-primary tracking-widest select-all" id="voucherCode">—</span>
</div>
<div class="px-space-lg pb-space-lg">
<button class="w-full h-12 rounded-full bg-surface-container text-primary font-label-md text-label-md font-semibold flex items-center justify-center gap-2" id="copyBtn" type="button">
<span class="material-symbols-outlined text-[18px]" id="copyIcon">content_copy</span>
<span id="copyText">Copier le code</span>
</button>
</div>
</div>

<div class="w-full rounded-2xl bg-surface-container p-space-md mb-space-lg flex flex-col gap-space-sm">
<span class="font-label-md text-label-md text-on-surface font-semibold">Comment l'utiliser</span>
<div class="flex items-start gap-space-sm">
<div class="w-6 h-6 rounded-full bg-primary text-on-primary flex items-center justify-center font-bold text-[12px] shrink-0 mt-0.5">1</div>
<span class="font-body-sm text-body-sm text-on-surface-variant">Connectez-vous au réseau Wi-Fi SMART.ECO</span>
</div>
<div class="flex items-start gap-space-sm">
<div class="w-6 h-6 rounded-full bg-primary text-on-primary flex items-center justify-center font-bold text-[12px] shrink-0 mt-0.5">2</div>
<span class="font-body-sm text-body-sm text-on-surface-variant">Entrez ce code sur la page qui s'ouvre automatiquement</span>
</div>
</div>

<button class="w-full h-12 rounded-full bg-primary text-on-primary font-label-lg text-label-lg font-semibold" onclick="window.location.href='../accueil_smart.eco/code.html'" type="button">Retour à l'accueil</button>

<div class="fixed top-16 left-1/2 -translate-x-1/2 z-50 pointer-events-none transition-all duration-300 opacity-0 -translate-y-2" id="toastNotification">
<div class="flex items-center gap-space-xs px-space-md py-2.5 rounded-full bg-inverse-surface text-inverse-on-surface shadow-lg">
<span class="material-symbols-outlined text-secondary-fixed text-[18px]">check_circle</span>
<span class="font-label-sm text-label-sm font-medium">Code copié</span>
</div>
</div>

</div>
</main>

<script>
  (function() {
    const NOMS = { heure: 'Forfait Heures', jour: 'Forfait Jour', semaine: 'Forfait Semaine', mois: 'Forfait Mois' };
    const commande = JSON.parse(localStorage.getItem('smarteco_commande') || '{}');
    if (commande.planId) {
      document.getElementById('plan-nom').textContent = NOMS[commande.planId] || 'Votre accès est prêt';
    }

    const realCode = localStorage.getItem('smarteco_voucher');
    if (realCode) document.getElementById('voucherCode').textContent = realCode;

    const copyBtn = document.getElementById('copyBtn');
    const copyText = document.getElementById('copyText');
    const copyIcon = document.getElementById('copyIcon');
    const toast = document.getElementById('toastNotification');

    copyBtn.addEventListener('click', () => {
      const code = document.getElementById('voucherCode').textContent.trim();
      if (code && code !== '—' && navigator.clipboard) {
        navigator.clipboard.writeText(code).catch(() => {});
      }
      copyText.textContent = 'Copié !';
      copyIcon.textContent = 'done';
      toast.classList.remove('opacity-0', '-translate-y-2');
      toast.classList.add('opacity-100', 'translate-y-0');
      setTimeout(() => {
        toast.classList.remove('opacity-100', 'translate-y-0');
        toast.classList.add('opacity-0', '-translate-y-2');
        copyText.textContent = 'Copier le code';
        copyIcon.textContent = 'content_copy';
      }, 2000);
    });
  })();
</script>

</body></html>
